[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-monitor-execution-agent"
version = "0.1.0"
description = "Local TEST-only Binance USD-M execution agent"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
execution-agent = "execution_agent.cli:main"

[tool.setuptools.packages.find]
include = ["execution_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
