name: macOS native foundation

on:
  pull_request:
    paths:
      - "apple/**"
      - "backend/app/api/auth_routes.py"
      - "backend/app/api/client_capabilities.py"
      - "backend/app/main.py"
      - "backend/tests/test_macos_auth_contract.py"
      - "backend/tests/test_macos_client_capabilities.py"
      - "backend/tests/test_auth_sessions.py"
      - ".github/workflows/macos-native.yml"
  push:
    branches: [main]
    paths:
      - "apple/**"
      - "backend/app/api/auth_routes.py"
      - "backend/app/api/client_capabilities.py"
      - "backend/app/main.py"
      - "backend/tests/test_macos_auth_contract.py"
      - "backend/tests/test_macos_client_capabilities.py"
      - "backend/tests/test_auth_sessions.py"

jobs:
  auth-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify selected OpenAPI contract
        env:
          APP_ENV: test
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_macos_auth_contract.py backend/tests/test_macos_client_capabilities.py backend/tests/test_auth_sessions.py

  native-foundation:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Install project tools
        run: brew install xcodegen swiftformat swiftlint
      - name: Generate Xcode project
        run: xcodegen generate --spec apple/project.yml --project apple
      - name: Verify parity and privacy manifests
        run: |
          python3 apple/scripts/verify-parity-matrix.py
          plutil -lint apple/Apps/StockMonitorMac/PrivacyInfo.xcprivacy
      - name: Lint Swift
        run: |
          swiftformat --lint --config apple/.swiftformat apple/Apps apple/Packages apple/Tests
          swiftlint lint --config apple/.swiftlint.yml --working-directory apple
      - name: Test Swift packages
        run: |
          swift test --package-path apple/Packages/StockMonitorCore
          swift test --package-path apple/Packages/StockMonitorDesign
          swift test --package-path apple/Packages/StockMonitorFeatures
      - name: Build SwiftUI app entry point for arm64
        run: swift build --package-path apple -c release --arch arm64
      - name: Verify local app bundle and entitlements
        run: apple/scripts/build-local-app.sh
      - name: Build unsigned arm64 Release
        run: >-
          xcodebuild -workspace apple/StockMonitor.xcworkspace
          -scheme StockMonitorMac -configuration Release
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO build
      - name: Run macOS accessibility smoke test
        env:
          # xcodebuild does not forward job-level env to the UITest runner
          # process; TEST_RUNNER_* is the documented injection point.
          TEST_RUNNER_CI: "true"
        run: >-
          xcodebuild -workspace apple/StockMonitor.xcworkspace
          -scheme StockMonitorMac -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGN_IDENTITY=- test
